services:
  retrodial-api:
    build: .
    container_name: retrodial-api
    restart: unless-stopped
    ports:
      - "8100:3000"
    environment:
      PORT: "3000"
      JELLYFIN_URL: "${JELLYFIN_URL:-http://192.168.1.33:8096}"
      JELLYFIN_USERNAME: "${JELLYFIN_USERNAME:?defina JELLYFIN_USERNAME no .env}"
      JELLYFIN_PASSWORD: "${JELLYFIN_PASSWORD:?defina JELLYFIN_PASSWORD no .env}"
